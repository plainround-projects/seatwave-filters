# The lab database for Module 21 (Lab 2 and the reduced-scale study of Section 8): PostgreSQL
# alone, under the Compose project name seatwave-filters. Start and stop it with scripts/stack.sh,
# which brings everything down with "down -v". The image is the Docker Official Image postgres:18.6
# (Debian trixie), pinned by tag and digest, checked on Docker Hub on 12 November 2026, with an
# arm64 variant: the same pin as Modules 13 and 14. One port, on 127.0.0.1 only, from Module 21's
# range 22100 to 22199. Nothing runs privileged, nothing uses the host network or the Docker socket;
# the only folder mounted is this project's db/init, read-only.
name: seatwave-filters

services:
  postgres:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: seatwave
      # Every password is a file generated at run time into .secrets (scripts/stack.sh up) and
      # removed by scripts/stack.sh down, together with the database that used it.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - owner_password
    command:
      - postgres
      # 384 MB of shared buffers: about a quarter of one_customer_per_ref at the study's
      # 50,000,000 names (about 1,560 MB), the share of the index Section 7 assumes stays cached
      # at 1,000,000,000 names on the reference machine. Lab 2's 1,000,000 names fit in it whole.
      - -c
      - shared_buffers=384MB
      # No replica and no archive: with minimal logging, a table created, filled and indexed in
      # one transaction writes no log records, which keeps the study's load off Docker's shared
      # disk (UsernameLoader).
      - -c
      - wal_level=minimal
      - -c
      - max_wal_senders=0
      - -c
      - track_io_timing=on
    security_opt:
      - no-new-privileges:true
    read_only: true
    # The entrypoint starts as root to own the data folder, then runs PostgreSQL as its own user.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    # Four CPUs like Module 1's reference machine; 2 GB of memory, not its 16 GB, because the
    # Docker virtual machine is shared with other projects.
    cpus: 4
    mem_limit: 2g
    shm_size: 512m
    tmpfs:
      - /var/run/postgresql
      - /tmp
    volumes:
      - pgdata:/var/lib/postgresql
      # Runs once, when the data volume is new: the owner role, its schema, the extension.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:22100:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "seatwave"]
      interval: 2s
      timeout: 2s
      retries: 30

secrets:
  postgres_password:
    file: ./.secrets/postgres.password
  owner_password:
    file: ./.secrets/owner.password

volumes:
  pgdata:
