# The lab database of compose.yaml (Lab 2 and the study of Section 8). Every key is required.
db.url=jdbc:postgresql://127.0.0.1:22100/seatwave
# Module 13's owner role: it owns the schema seatwave, where customers lives.
db.user=seatwave_owner
# Written by scripts/stack.sh up, deleted by scripts/stack.sh down.
db.passwordFile=.secrets/owner.password
# One connection runs the checks and one reads the statistics between phases.
db.poolSize=2
db.connectionTimeoutMillis=5000
# The longest single statement is the index build of the largest load (about a minute at
# 50,000,000 names on the laptop); a check's answer takes under a millisecond.
db.socketTimeoutSeconds=300
# Checks per measured phase of the study: 100,000, as in UsernameCheckCli and Lab 2.
study.checks=100000
# Never-added names probed against each filter: 1,000,000, as in FalsePositiveCli.
study.probes=1000000
